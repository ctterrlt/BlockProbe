# Flet user extension: active Android network and Private DNS state.
name: blockprobe_android_network
description: BlockProbe Android active-network DNS and Private DNS reader for Flet.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.1.5 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flet: ">=1.0.5 <2.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: io.github.ctterrlt.blockprobe_android_network
        pluginClass: BlockProbeAndroidNetworkPlugin
