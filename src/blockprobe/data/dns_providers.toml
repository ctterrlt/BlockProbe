# Local, conservative classification of well-known DNS resolvers.
#
# This is a hint catalog, not a copy of any provider's live blocklist. The
# categories describe the provider's documented default/family profile; a
# custom profile can be hosted on any IP and can change at any time. BlockProbe
# never downloads a provider blocklist or claims to know its complete policy.
#
# `hostname` is the provider's documented public resolver hostname, not a
# reverse-DNS guess. It is empty when the provider has no safe public mapping.
# `filtering` keeps the existing "known to filter content/family traffic"
# meaning used by dns_filter_evidence(); ad/security-only profiles keep
# `filtering = false` but still expose their documented `categories`.
schema_version = 1

[[providers]]
id = "cloudflare"
name = "Cloudflare"
hostname = "cloudflare-dns.com"
servers = [
    "1.1.1.1",
    "1.0.0.1",
    "2606:4700:4700::1111",
    "2606:4700:4700::1001",
]
filtering = false
categories = []
notes = "Public resolver with no content filtering by default."

[[providers]]
id = "cloudflare-malware"
name = "Cloudflare for Families (malware)"
hostname = "security.cloudflare-dns.com"
servers = [
    "1.1.1.2",
    "1.0.0.2",
    "2606:4700:4700::1112",
    "2606:4700:4700::1002",
]
filtering = true
categories = ["malware", "phishing"]
notes = "Blocks malware and phishing. Cloudflare controls the live host list; BlockProbe cannot verify it."

[[providers]]
id = "cloudflare-family"
name = "Cloudflare for Families (malware and adult content)"
hostname = "family.cloudflare-dns.com"
servers = [
    "1.1.1.3",
    "1.0.0.3",
    "2606:4700:4700::1113",
    "2606:4700:4700::1003",
]
filtering = true
categories = ["malware", "phishing", "adult"]
notes = "Blocks malware, phishing and adult content. Cloudflare controls the live host list; BlockProbe cannot verify it."

