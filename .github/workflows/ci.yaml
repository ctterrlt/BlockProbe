# SPDX-License-Identifier: AGPL-3.0-or-later
# Purpose: CI workflow: lint, type-check and tests on Windows, macOS and Linux.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.7
          enable-cache: true
      - name: Install locked project dependencies
        run: uv sync --locked --extra dev
      - name: Build Rust scan engine
        run: uv run --locked python scripts/build_rust_engine.py
      - name: Check Rust formatting
        run: uv run --locked cargo fmt --all -- --check
      - name: Test Rust core
        run: uv run --locked cargo test --workspace --offline
      - name: Lint
        run: uv run --locked python -m ruff check src tests scripts
      - name: Types (core, strict)
        run: uv run --locked python -m mypy
      - name: Tests
        run: uv run --locked python -m pytest --cov=blockprobe.core --cov-report=term-missing
