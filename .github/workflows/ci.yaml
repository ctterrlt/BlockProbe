# SPDX-License-Identifier: AGPL-3.0-or-later
# Purpose: CI workflow: lint, type-check and tests on Windows, macOS and Linux.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build Rust scan engine
        run: python scripts/build_rust_engine.py
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust core
        run: cargo test --workspace --offline
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Types (core, strict)
        run: python -m mypy
      - name: Tests
        run: python -m pytest --cov=blockprobe.core --cov-report=term-missing
