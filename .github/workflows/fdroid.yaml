# SPDX-License-Identifier: AGPL-3.0-or-later
# Purpose: Submit tagged F-Droid metadata after the GitHub Release workflow succeeds.

name: F-Droid

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Version to render (defaults to root VERSION)
        required: false
        type: string
      commit:
        description: Source tag or commit for fdroiddata (defaults to this ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fdroid-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  NO_COLOR: "1"

jobs:
  fdroid:
    name: Submit F-Droid metadata after a successful release
    if: >-
      github.repository == 'ctterrlt/BlockProbe' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run is privileged; execute only trusted default-branch code.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.7
          enable-cache: true
      - name: Install locked project dependencies
        run: uv sync --locked --extra dev
      - name: Prepare release metadata inputs
        id: release_inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          mkdir -p build/fdroid
          printf '%s\n' 'FDROID_METADATA=fdroid/io.github.ctterrlt.blockprobe.yaml' >> "$GITHUB_ENV"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v-?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release workflow head is not a supported version tag." >&2
              exit 1
            fi
            if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Release workflow head SHA is invalid." >&2
              exit 1
            fi
            # A tag can be corrected or moved after Release starts. Build the
            # metadata for the exact source commit that Release completed, not
            # whichever commit the mutable tag happens to reference now.
            git fetch --no-tags --depth=1 origin "$RELEASE_SHA"
            release_sha="$(git rev-parse "${RELEASE_SHA}^{commit}")"
            if [[ "$release_sha" != "$RELEASE_SHA" ]]; then
              echo "Release workflow commit could not be resolved exactly." >&2
              exit 1
            fi
            version="$(git show "${RELEASE_SHA}:VERSION" | tr -d '[:space:]')"
            packaged_version="$(git show "${RELEASE_SHA}:src/blockprobe/VERSION" | tr -d '[:space:]')"
            if [[ "$packaged_version" != "$version" ]]; then
              echo "Packaged VERSION does not match the root VERSION." >&2
              exit 1
            fi
            tag_version="${RELEASE_TAG#v}"
            tag_version="${tag_version#-}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Release tag and root VERSION do not match." >&2
              exit 1
            fi
            git show "${RELEASE_SHA}:fdroid/io.github.ctterrlt.blockprobe.yaml" \
              > build/fdroid/io.github.ctterrlt.blockprobe.yaml
            printf 'FDROID_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
            printf 'FDROID_COMMIT=%s\n' "$RELEASE_SHA" >> "$GITHUB_ENV"
            printf '%s\n' \
              'FDROID_METADATA=build/fdroid/io.github.ctterrlt.blockprobe.yaml' \
              >> "$GITHUB_ENV"
          else
            version="${INPUT_VERSION:-$(tr -d '[:space:]' < VERSION)}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported version format." >&2
              exit 1
            fi
            printf 'FDROID_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
            if [[ -n "$INPUT_COMMIT" ]]; then
              if [[ ! "$INPUT_COMMIT" =~ ^(v-?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?|[0-9a-fA-F]{40})$ ]]; then
                echo "Commit must be a supported version tag or 40-character Git SHA." >&2
                exit 1
              fi
              printf 'FDROID_COMMIT=%s\n' "$INPUT_COMMIT" >> "$GITHUB_ENV"
            fi
          fi

          is_prerelease_version() {
            [[ "$1" == *-* ]]
          }
          if is_prerelease_version "$version"; then
            echo "Skipping GitLab submission for prerelease version $version."
            printf 'skip_gitlab=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skip_gitlab=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Render metadata
        run: |
          args=(--metadata "$FDROID_METADATA")
          if [[ -n "${FDROID_VERSION:-}" ]]; then args+=(--version "$FDROID_VERSION"); fi
          if [[ -n "${FDROID_COMMIT:-}" ]]; then args+=(--commit "$FDROID_COMMIT"); fi
          uv run --locked python scripts/fdroid_submit.py "${args[@]}" \
            --output build/fdroid/io.github.ctterrlt.blockprobe.yaml
      - name: Validate rendered metadata
        run: |
          args=(--metadata "$FDROID_METADATA")
          if [[ -n "${FDROID_VERSION:-}" ]]; then args+=(--version "$FDROID_VERSION"); fi
          if [[ -n "${FDROID_COMMIT:-}" ]]; then args+=(--commit "$FDROID_COMMIT"); fi
          uv run --locked python scripts/fdroid_submit.py "${args[@]}" --check \
            --output build/fdroid/io.github.ctterrlt.blockprobe.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: fdroid-metadata
          path: build/fdroid/io.github.ctterrlt.blockprobe.yaml
          if-no-files-found: error
      - name: Open or update fdroiddata merge request
        if: steps.release_inputs.outputs.skip_gitlab != 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::Add the GITLAB_TOKEN repository secret to enable automatic F-Droid submission."
            exit 1
          fi
          args=(--metadata "$FDROID_METADATA" --submit)
          if [[ -n "${FDROID_VERSION:-}" ]]; then args+=(--version "$FDROID_VERSION"); fi
          if [[ -n "${FDROID_COMMIT:-}" ]]; then args+=(--commit "$FDROID_COMMIT"); fi
          uv run --locked python scripts/fdroid_submit.py "${args[@]}"
