# SPDX-License-Identifier: AGPL-3.0-or-later
# Purpose: Project metadata, dependencies, extras and Flet app identity.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "blockprobe"
version = "1.1.1"
description = "Local-first tool that verifies whether gambling sites remain reachable after installing a blocker."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Christian", email = "tursi.christian9@gmail.com" }]
keywords = [
    "betblocker",
    "dns-filter",
    "gambling",
    "local-first",
    "privacy",
    "self-exclusion",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Android",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "diskcache>=5.6",
    "dnspython>=2.6",
    # flet-web 1.0.x still passes openapi_prefix to FastAPI.
    "fastapi>=0.100,<0.116",
    "flet>=1.0,<2",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "tldextract>=5.1",
    "typer>=0.12",
]

[project.optional-dependencies]
desktop = ["flet[all]>=1.0,<2"]
packaging = ["build>=1.2", "flet[all]>=1.0,<2"]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
blockprobe = "blockprobe.cli:main"

[project.urls]
Homepage = "https://github.com/ctterrlt/BlockProbe"
Repository = "https://github.com/ctterrlt/BlockProbe"
Issues = "https://github.com/ctterrlt/BlockProbe/issues"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM105", # try/except/pass around optional UI and probe calls is intentional
    "B008",   # Typer options use function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"] # sys.path setup must run before app imports
"src/blockprobe/i18n.py" = ["E501"] # one translation per line; long sentences are data, not code

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
files = ["src/blockprobe/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:diskcache.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/blockprobe"]
exclude = ["**/.gitkeep", "**/__pycache__", "**/*.pyc"]

[tool.flet]
org = "io.github.ctterrlt"
product = "BlockProbe"
company = "BlockProbe contributors"
copyright = "Copyright (C) 2026 Christian"
build_number = 3
bundle_id = "io.github.ctterrlt.blockprobe"
icon_background = "#0B1220"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#0B1220"
dark_color = "#0B1220"

[tool.flet.android]
split_per_abi = false

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.android.manifest_application]
allowBackup = false

[tool.flet.windows]
artifact = "BlockProbe"

[tool.flet.macos]
artifact = "BlockProbe"

[tool.flet.linux]
artifact = "blockprobe"

[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
theme_mode = "dark"
bgcolor_dark = "#0B1115"
spinner_color_dark = "#76D6C1"
spinner_size = 28
prepare_message = "Preparing BlockProbe…"
startup_message = "Starting BlockProbe…"
